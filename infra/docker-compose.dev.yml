services:
  # Primary Transactional Database
  postgres:
    image: postgres:16-alpine
    container_name: estimation-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: estimation
    ports:
      - '5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Cache and Pub/Sub for Real-time WebSockets
  redis:
    image: redis:7-alpine
    container_name: estimation-redis
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data

  # Event Streaming Backbone
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: estimation-kafka
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Analytics and Time-Series DB
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: estimation-clickhouse
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - chdata:/var/lib/clickhouse

  # Full-text Search & Knowledge Graph Queries
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: estimation-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - esdata:/usr/share/elasticsearch/data

  # Visual Control Room for the entire platform
  grafana:
    image: grafana/grafana:latest
    container_name: estimation-grafana
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - postgres
      - clickhouse
      - redis

volumes:
  pgdata:
  redisdata:
  chdata:
  esdata:
